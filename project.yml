name: FileFormatter
options:
  bundleIdPrefix: com.taufan
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FileFormatter:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_NAME: FileFormatter
        PRODUCT_BUNDLE_IDENTIFIER: com.taufan.fileformatter
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: FileFormatterCore
        product: FileFormatterCore
      - package: Sparkle
    postBuildScripts:
      - name: Bundle FFmpeg Helpers
        basedOnDependencyAnalysis: false
        script: |
          set -e
          HELPERS="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Helpers"
          mkdir -p "$HELPERS"
          if [ -x "$SRCROOT/vendor/ffmpeg/bin/ffmpeg" ]; then
            cp -f "$SRCROOT/vendor/ffmpeg/bin/ffmpeg" "$HELPERS/ffmpeg"
            cp -f "$SRCROOT/vendor/ffmpeg/bin/ffprobe" "$HELPERS/ffprobe"
            chmod +x "$HELPERS/ffmpeg" "$HELPERS/ffprobe"
            codesign --force --sign - "$HELPERS/ffmpeg" "$HELPERS/ffprobe" || true
          else
            echo "warning: vendor/ffmpeg/bin missing; media conversion will not work"
          fi
          MODELS="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Models"
          mkdir -p "$MODELS"
          if [ -d "$SRCROOT/vendor/birefnet/BiRefNetLite.mlmodelc" ]; then
            rm -rf "$MODELS/BiRefNetLite.mlmodelc"
            cp -R "$SRCROOT/vendor/birefnet/BiRefNetLite.mlmodelc" "$MODELS/"
          else
            echo "warning: vendor/birefnet missing (make bootstrap-model); background removal falls back to Vision"
          fi
          LICENSES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Licenses"
          mkdir -p "$LICENSES"
          cp -f "$SRCROOT/vendor/ffmpeg/COPYING.LGPLv2.1" "$LICENSES/" 2>/dev/null || true
          cp -f "$SRCROOT/vendor/ffmpeg/BUILD-INFO.txt" "$LICENSES/" 2>/dev/null || true
          cp -f "$SRCROOT/docs/THIRD_PARTY.md" "$LICENSES/" 2>/dev/null || true
          cp -R "$SRCROOT/docs/licenses/." "$LICENSES/" 2>/dev/null || true
          codesign --force --deep --sign - "$TARGET_BUILD_DIR/$WRAPPER_NAME" || true
packages:
  FileFormatterCore:
    path: Packages/FileFormatterCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
schemes:
  FileFormatter:
    build:
      targets:
        FileFormatter: all
    run:
      config: Debug
    archive:
      config: Release
